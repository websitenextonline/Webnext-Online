name: Inspect WebNextOnline Portfolio Structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact portfolio card markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf-8')
          print('FILE_SIZE',len(s),'LINE_COUNT',s.count('\\n'))
          for term in ['const PC=', 'let PC=', 'WN_PORTFOLIO_IMAGES=', 'function rpf(', 'let pf=', 'portfolioQuery', 'window.addEventListener']:
              print('\\nTERM',term,'OCCURRENCES',s.lower().count(term.lower()))
              i=s.lower().find(term.lower())
              if i>=0:
                  print('CONTEXT_START',repr(s[max(0,i-160):i+2600])[:2900],'CONTEXT_END')
          PY
