name: Inspect WebNextOnline Portfolio Structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact portfolio card markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf-8')
          print('FILE_SIZE',len(s),'LINE_COUNT',s.count('\\n'))
          for term in ['id="vt"', 'id="wnTeamAlbum"', 'class="tm', 'hamza-farooq/', 'abdul-haseeb/', 'TEAM', 'Meet the team']:
              print('TERM',term,'OCCURRENCES',s.lower().count(term.lower()))
              i=s.find(term)
              if i>=0:
                  excerpt=s[max(0,i-350):i+6500]
                  excerpt=re.sub(r'data:image/[^"\s]+','[INLINE IMAGE OMITTED]',excerpt)
                  print('EXCERPT',repr(excerpt)[:6900])
          PY
