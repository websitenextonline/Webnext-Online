name: Apply mobile responsive fixes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-responsive-fix.yml'
      - 'mobile-fix.css'
      - 'index.html'
permissions:
  contents: write
concurrency:
  group: webnext-mobile-fix
  cancel-in-progress: false
jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Embed current mobile CSS without replacing the homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          site=Path('index.html')
          css=Path('mobile-fix.css')
          html=site.read_text(encoding='utf-8')
          if not html.strip() or '</head>' not in html.lower():
              raise SystemExit('Homepage is empty or missing </head>; no changes made')
          updated=re.sub(r'<link\b[^>]*\bid="wn-mobile-fix"[^>]*>', '', html, flags=re.I)
          updated=re.sub(r'<style\b[^>]*\bid="wn-mobile-fix-inline"[^>]*>.*?</style>', '', updated, flags=re.I|re.S)
          marker='<style id="wn-mobile-fix-inline">'+css.read_text(encoding='utf-8')+'</style>'
          updated=re.sub(r'</head>', lambda m: marker+'\n'+m.group(0), updated, count=1, flags=re.I)
          if updated!=html:
              site.write_text(updated, encoding='utf-8')
          PY
      - name: Commit responsive styles
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix mobile width, course cards, About image and footer"
            git push
          fi
