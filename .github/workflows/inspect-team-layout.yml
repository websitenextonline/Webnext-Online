name: Inspect existing team cards
on:
  push:
    paths: ['.github/workflows/inspect-team-layout.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Team portfolios cards and markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf-8')
          for term in ['const TEAM','const TM','ceo.innerHTML','$("#ceo")','document.getElementById("ceo")','team portfolios','View Portfolio','View Profile','id="ceo"']:
            indexes=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
            print('TERM',term,'MATCHES',len(indexes),'POSITIONS',indexes[:15])
            for i in indexes[:2]:
              txt=s[max(0,i-750):i+3500]
              txt=re.sub(r'data:image/[^"\s]+','[BASE64 IMAGE]',txt)
              print('SNIPPET',repr(txt[:4500]))
          PY