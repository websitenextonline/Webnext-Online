name: Inspect existing team cards
on:
  push:
    paths: ['.github/workflows/inspect-team-layout.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Team portfolios cards and markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf-8')
          for term in ['Team portfolios','portfolio & profiles','team-profiles','team-card','View Portfolio','View Profile']:
            print('SEARCH',term)
            matches=[]
            for p in Path('.').rglob('*'):
              if not p.is_file() or p.name=='index.html' or '.git' in p.parts:continue
              if p.suffix not in ['.js','.html','.css']:continue
              try:
                content=p.read_text('utf-8')
                if term.lower() in content.lower():matches.append(str(p))
              except:pass
            print('FILES',matches[:30])
          for term in ['#vt','wn-team','team profiles']:
            print('INDEX_TERM',term,'COUNT',s.lower().count(term.lower()))
          PY