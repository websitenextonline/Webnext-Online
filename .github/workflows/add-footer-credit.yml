name: Add Haseeb Crafts footer credit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-footer-credit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add linked footer credit without altering other sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          credit='<div id="wn-hc-credit" style="text-align:center;padding:16px 20px 20px;color:#a9bed0;font-size:13px;line-height:1.6;border-top:1px solid rgba(140,170,200,.15)">Made by <a href="https://haseebcrafts.com/" target="_blank" rel="noopener" style="color:#83ceff;font-weight:700;text-decoration:underline;text-underline-offset:3px">Haseeb Crafts</a></div>'
          s=re.sub(r'<div id="wn-hc-credit"[^>]*>.*?</div>','',s,flags=re.S)
          credit='<div id="wn-hc-credit" style="position:relative;z-index:20;text-align:center;padding:16px 20px 20px;color:#a9bed0;font-size:13px;line-height:1.6">Made by <a href="https://haseebcrafts.com/" style="position:relative;pointer-events:auto;color:#83ceff;font-weight:700;text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();">Haseeb Crafts</a></div>'
          assert '</footer>' in s
          s=s.replace('</footer>',credit+'</footer>',1)
          p.write_text(s,encoding='utf-8')
          assert s.count('id="wn-hc-credit"')==1
          print('Footer credit verified')
          PY
      - name: Commit footer only
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Add clickable Made by Haseeb Crafts footer credit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
