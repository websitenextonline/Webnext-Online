name: Link website cost guide
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-cost-guide.yml'
      - '.github/scripts/link-cost-guide.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: link-website-cost-guide
  cancel-in-progress: false
jobs:
  link-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add guide links and calculator deep link
        run: python .github/scripts/link-cost-guide.py
      - name: Commit homepage links when changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Link website cost guide from homepage and calculator'
          git push origin HEAD:main
