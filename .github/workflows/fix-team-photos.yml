name: Fix WebNextOnline team photos
on:
  push:
    paths:
      - '.github/workflows/fix-team-photos.yml'
permissions:
  contents: write
jobs:
  swap-team-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install beautifulsoup4
      - name: Swap Rehman and Talal image references
        env:
          FIX_SCRIPT: |
            from pathlib import Path
            import re, subprocess
            p=Path("index.html")
            h=p.read_text(encoding="utf-8")
            a=re.compile(r'(name:"Rehman"[^\n]{0,170}?photo:)IM\.t4')
            b=re.compile(r'(name:"Talal"[^\n]{0,170}?photo:)IM\.t7')
            if len(a.findall(h))!=1 or len(b.findall(h))!=1:
                raise SystemExit("Team references not unique; refusing unsafe edit")
            h=a.sub(r'\g<1>IM.t7',h)
            h=b.sub(r'\g<1>IM.t4',h)
            if h.count('"rehman":') != 1 or h.count('"talal":') != 1:
                raise SystemExit("Named portrait keys are not unique; refusing unsafe edit")
            h=h.replace('"rehman":','"__photo_key_temp__":').replace('"talal":','"rehman":').replace('"__photo_key_temp__":','"talal":')
            p.write_text(h,encoding="utf-8")
            subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
            subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
            subprocess.run(["git","add","index.html"],check=True)
            subprocess.run(["git","commit","-m","Swap Rehman and Talal team portraits"],check=True)
            subprocess.run(["git","push"],check=True)
            print("Rehman and Talal photo mappings swapped successfully")
            
        run: python -c "$FIX_SCRIPT"
