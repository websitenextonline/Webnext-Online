name: Fix WebNextOnline team photos
on:
  push:
    paths:
      - '.github/workflows/fix-team-photos.yml'
permissions:
  contents: write
jobs:
  swap-team-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install beautifulsoup4
      - name: Swap Rehman and Talal image references
        env:
          FIX_SCRIPT: |
            from pathlib import Path
            import re
            h=Path("index.html").read_text(encoding="utf-8")
            print("Length",len(h))
            for term in ("rehman","rahman","talal","team","meeting"):
                m=list(re.finditer(term,h,re.I))
                print(term,"count",len(m))
                for a in m[:5]:
                    around=h[max(0,a.start()-180):a.end()+180]
                    around=re.sub(r"data:image/[^\"'<> ]+", "[EMBEDDED IMAGE]",around)
                    print("CONTEXT",repr(around[:380]))
            
        run: python -c "$FIX_SCRIPT"
